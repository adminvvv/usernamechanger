# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '26.1'
            fabric: '0.145.1+26.1'
          - minecraft: '26.1.1'
            fabric: '0.145.4+26.1.1'
          - minecraft: '26.1.2'
            fabric: '0.155.3+26.1.2'
          - minecraft: '26.2'
            fabric: '0.161.0+26.2'
          - minecraft: '26.3'
            fabric: '0.161.0+26.3'
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build runGametest -Pminecraft_version=${{ matrix.minecraft }} -Pfabric_api_version=${{ matrix.fabric }}
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts-${{ matrix.minecraft }}
          path: build/libs/
      - name: capture test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Tests-${{ matrix.minecraft }}
          path: |
            build/reports/tests/
            build/gametest-run/*/logs/
